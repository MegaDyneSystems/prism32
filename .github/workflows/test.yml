name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # ubuntu-latest (26.04) no longer ships EOL Pythons — pin those
          # jobs to the ubuntu-24.04 image (same pattern as the 3.7 job).
          - python-version: '3.9'
            os: ubuntu-24.04
          - python-version: '3.10'   # 3.10 EOL 2026-10; pin pre-emptively
            os: ubuntu-24.04
          - python-version: '3.11'
            os: ubuntu-latest
          - python-version: '3.12'
            os: ubuntu-latest
          - python-version: '3.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: python -m pip install --quiet pytest

      - name: Compile check
        run: python -m py_compile prism32.py

      - name: Run tests
        run: python -m pytest tests/ -x -q

  cross-compile:
    name: Test Python 3.7 compilation
    # 3.7 binaries are unavailable on ubuntu-latest (24.04) runners
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'

      - name: Compile for embedded
        run: python -m py_compile prism32.py
